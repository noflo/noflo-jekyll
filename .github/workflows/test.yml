name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - "22.x"
          - "24.x"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload flowtrace artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flowtrace-${{ matrix.node-version }}
          path: .flowtrace/
          if-no-files-found: ignore
